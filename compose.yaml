services:
  postgres:
    image: postgres:17-alpine
    container_name: cartdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartdb
    ports:
      - "5433:5432"
    volumes:
      - cartdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cartdb_data:
